<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">TRIZ 取舍工作流</title>
  <desc id="desc">展示一个自然游戏开发吐槽如何变成取舍、解法模式、最小可试玩测试和验证方式。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#277a69"/>
    </marker>
  </defs>
  <rect width="1280" height="560" fill="#f7f3ea"/>
  <rect x="48" y="44" width="1184" height="472" rx="24" fill="#fffaf0" stroke="#d7cab7" stroke-width="3"/>
  <text x="86" y="104" fill="#1d2330" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="38" font-weight="800">这个项目里的 TRIZ</text>
  <text x="86" y="142" fill="#657084" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="22">它是一层游戏开发取舍判断，不是一堂理论课。</text>

  <rect x="76" y="196" width="205" height="172" rx="16" fill="#ffffff" stroke="#c9d8d3" stroke-width="2"/>
  <text x="102" y="238" fill="#277a69" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700">自然吐槽</text>
  <text x="102" y="282" fill="#1d2330" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="22">Boss 二阶段</text>
  <text x="102" y="314" fill="#1d2330" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="22">有点无聊，</text>
  <text x="102" y="346" fill="#1d2330" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="22">但别阴间。</text>

  <line x1="298" y1="282" x2="365" y2="282" stroke="#277a69" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="382" y="196" width="205" height="172" rx="16" fill="#e8f4ee" stroke="#8bc4b4" stroke-width="2"/>
  <text x="410" y="238" fill="#277a69" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700">核心取舍</text>
  <text x="410" y="282" fill="#1d2330" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="22">增加张力，</text>
  <text x="410" y="314" fill="#1d2330" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="22">但不能造成</text>
  <text x="410" y="346" fill="#1d2330" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="22">不公平死亡。</text>

  <line x1="604" y1="282" x2="671" y2="282" stroke="#277a69" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="688" y="196" width="205" height="172" rx="16" fill="#fff7e3" stroke="#e0bd6d" stroke-width="2"/>
  <text x="716" y="238" fill="#8a6420" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700">解法模式</text>
  <text x="716" y="282" fill="#1d2330" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="22">先教学，</text>
  <text x="716" y="314" fill="#1d2330" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="22">再改变时机</text>
  <text x="716" y="346" fill="#1d2330" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="22">或条件。</text>

  <line x1="910" y1="282" x2="977" y2="282" stroke="#277a69" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="994" y="196" width="205" height="172" rx="16" fill="#ffe9df" stroke="#ef9b83" stroke-width="2"/>
  <text x="1022" y="238" fill="#8d2018" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700">最小测试</text>
  <text x="1022" y="282" fill="#1d2330" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="22">一个可读</text>
  <text x="1022" y="314" fill="#1d2330" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="22">攻击家族</text>
  <text x="1022" y="346" fill="#1d2330" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="22">加一个变体。</text>

  <rect x="146" y="414" width="988" height="58" rx="14" fill="#1d2330"/>
  <text x="178" y="451" fill="#ffffff" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700">验证：</text>
  <text x="252" y="451" fill="#ffffff" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="22">玩家能否说清为什么被打中，并在下一次尝试中学会应对？</text>
</svg>
