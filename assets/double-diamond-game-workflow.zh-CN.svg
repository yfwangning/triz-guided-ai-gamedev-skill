<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">双钻游戏设计工作流</title>
  <desc id="desc">展示 AI 辅助游戏开发中的问题发散、问题收敛、方案发散和方案收敛。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#277a69"/>
    </marker>
  </defs>
  <rect width="1280" height="560" fill="#f7f3ea"/>
  <rect x="48" y="44" width="1184" height="472" rx="24" fill="#fffaf0" stroke="#d7cab7" stroke-width="3"/>
  <text x="86" y="104" fill="#1d2330" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="38" font-weight="800">这个项目里的双钻模型</text>
  <text x="86" y="142" fill="#657084" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="22">当用户需要更多创意时，先发散，再收敛到最小可试玩测试。</text>

  <polygon points="104,288 300,160 496,288 300,416" fill="#e8f4ee" stroke="#8bc4b4" stroke-width="4"/>
  <polygon points="560,288 756,160 952,288 756,416" fill="#fff7e3" stroke="#e0bd6d" stroke-width="4"/>
  <line x1="500" y1="288" x2="552" y2="288" stroke="#277a69" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="958" y1="288" x2="1064" y2="288" stroke="#277a69" stroke-width="4" marker-end="url(#arrow)"/>

  <text x="300" y="278" text-anchor="middle" fill="#277a69" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="34" font-weight="800">问题空间</text>
  <text x="300" y="318" text-anchor="middle" fill="#1d2330" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="28" font-weight="700">先理解真正矛盾</text>

  <text x="756" y="278" text-anchor="middle" fill="#8a6420" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="34" font-weight="800">方案空间</text>
  <text x="756" y="318" text-anchor="middle" fill="#1d2330" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="28" font-weight="700">再选择最小测试</text>

  <rect x="1068" y="220" width="144" height="136" rx="16" fill="#ffe9df" stroke="#ef9b83" stroke-width="2"/>
  <text x="1096" y="266" fill="#8d2018" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="800">构建</text>
  <text x="1096" y="300" fill="#1d2330" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="21">验证</text>
  <text x="1096" y="330" fill="#1d2330" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="21">迭代</text>

  <rect x="86" y="426" width="250" height="52" rx="12" fill="#ffffff" stroke="#c9d8d3" stroke-width="2"/>
  <text x="106" y="449" fill="#277a69" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="800">1. 问题发散</text>
  <text x="106" y="470" fill="#1d2330" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="16">这个吐槽可能指什么</text>

  <rect x="354" y="426" width="250" height="52" rx="12" fill="#ffffff" stroke="#c9d8d3" stroke-width="2"/>
  <text x="374" y="449" fill="#277a69" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="800">2. 问题收敛</text>
  <text x="374" y="470" fill="#1d2330" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="16">先解决哪个取舍</text>

  <rect x="622" y="426" width="250" height="52" rx="12" fill="#ffffff" stroke="#e0bd6d" stroke-width="2"/>
  <text x="642" y="449" fill="#8a6420" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="800">3. 方案发散</text>
  <text x="642" y="470" fill="#1d2330" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="16">稳妥、奇怪、系统性方案</text>

  <rect x="890" y="426" width="250" height="52" rx="12" fill="#ffffff" stroke="#e0bd6d" stroke-width="2"/>
  <text x="910" y="449" fill="#8a6420" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="800">4. 方案收敛</text>
  <text x="910" y="470" fill="#1d2330" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="16">最小可试玩测试</text>

  <text x="146" y="504" fill="#657084" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20">默认模式保持简短。双钻只在需要探索、头脑风暴或避免过早收敛时启用。</text>
</svg>
